name: zk wasm reproducibility

on:
  push:
    branches: [main, v2]
    paths: ["programs/zk-elgamal-proof/**"]
  pull_request:
    paths: ["programs/zk-elgamal-proof/**"]

jobs:
  verify-blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Rebuild wasm from pinned sources to confirm reproducibility
        working-directory: programs/zk-elgamal-proof
        run: go run ./internal/genwasm -check