name: zk wasm reproducibility

on:
  push:
    branches: [main, v2]
    paths: ["programs/zk-elgamal-proof/**"]
  pull_request:
    paths: ["programs/zk-elgamal-proof/**"]

jobs:
  verify-blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Rebuild wasm from pinned sources to confirm reproducibility
        working-directory: programs/zk-elgamal-proof
        run: go run ./internal/genwasm -check